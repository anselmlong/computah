name: Check and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: Dry run builds and packages; preview also deploys a preview site
        type: choice
        options: [dry-run, preview]
        default: dry-run
      version:
        description: Version to test (for example v0.1.1)
        default: v0.1.1
        required: true

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and test
        run: |
          swift build
          swift test
          python3 -m unittest discover -s scripts/tests -v
          node --test scripts/tests/site.test.cjs
          swiftc scripts/InstallRelease.swift -o /tmp/computah-install-check
          zsh -n scripts/build.sh

  release:
    needs: check
    if: >-
      github.repository == 'anselmlong/computah2' &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: [self-hosted, macOS, ARM64, computah-release]
    timeout-minutes: 25
    concurrency:
      group: computah-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require source already on main
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Build, deploy, and open release (or dry run)
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
          RELEASE_MODE: ${{ github.event_name == 'push' && 'publish' || inputs.mode }}
        run: python3 scripts/release.py --tag "$RELEASE_TAG" --mode "$RELEASE_MODE"
      - name: Keep the exact ZIP and checksum manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Computah-${{ github.run_id }}
          path: |
            dist/Computah.zip
            dist/release.json
          if-no-files-found: ignore
